name: Compilar Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar
        run: dotnet restore src/S10ProjectConverter/S10ProjectConverter.csproj
      - name: Publicar
        run: dotnet publish src/S10ProjectConverter/S10ProjectConverter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Adjuntar programa
        uses: actions/upload-artifact@v4
        with:
          name: S10-Project-Converter-Windows
          path: publish/